<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RYFTcoin — Faucet Bakiyesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131f;
      --border: #1e1e30;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
      --error: #ef4444;
      --glow: 0 0 40px rgba(124, 58, 237, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 20%, rgba(124,58,237,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(6,182,212,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px 20px 40px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: var(--glow);
    }

    .logo-text {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .label {
      color: var(--muted);
      font-size: 13px;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .refresh-btn {
      background: var(--border);
      border: none;
      border-radius: 10px;
      width: 44px; height: 44px;
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .refresh-btn:hover { background: var(--accent); color: white; }
    .refresh-btn.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .balance-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 0;
      border-top: 1px solid var(--border);
    }
    .balance-row:first-child { border-top: none; padding-top: 0; }

    .balance-amount {
      font-size: 32px;
      font-weight: 800;
      color: var(--accent2);
      font-family: 'Space Mono', monospace;
      word-break: break-all;
    }

    .balance-currency {
      font-size: 16px;
      font-weight: 700;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
    }

    .status {
      margin-top: 20px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      min-height: 20px;
    }
    .status.error { color: var(--error); }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
      font-family: 'Space Mono', monospace;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <span class="logo-text">RYFTcoin</span>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-head">
      <span class="label">Faucet Bakiyesi</span>
      <button class="refresh-btn" id="refreshBtn" title="Yenile" aria-label="Yenile">↻</button>
    </div>

    <div id="balances" aria-live="polite">
      <div class="balance-row">
        <span class="balance-amount">—</span>
      </div>
    </div>

    <div class="status" id="status">Yükleniyor...</div>
  </div>
</main>

<footer>powered by FaucetPay</footer>

<script>
  // Backend adresin (Render/Railway vb.). Sonunda "/" olmasın.
  const BACKEND_URL = 'https://ryftcoin.onrender.com';

  const balancesEl = document.getElementById('balances');
  const statusEl   = document.getElementById('status');
  const refreshBtn = document.getElementById('refreshBtn');

  let loading = false;

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = 'status' + (isError ? ' error' : '');
  }

  function render(balances) {
    balancesEl.innerHTML = '';
    for (const b of balances) {
      const row = document.createElement('div');
      row.className = 'balance-row';
      const amount = document.createElement('span');
      amount.className = 'balance-amount';
      amount.textContent = b.amount;
      const cur = document.createElement('span');
      cur.className = 'balance-currency';
      cur.textContent = b.currency;
      row.append(amount, cur);
      balancesEl.appendChild(row);
    }
  }

  async function loadBalance() {
    if (loading) return;
    loading = true;
    refreshBtn.classList.add('spinning');

    // Ücretsiz sunucu uykudaysa ilk istek yavaş olabilir, kullanıcıyı bilgilendir
    const slowTimer = setTimeout(function () {
      setStatus('Sunucu uyanıyor olabilir, bu 1 dakikaya kadar sürebilir...', false);
    }, 4000);

    try {
      const controller = new AbortController();
      const abortTimer = setTimeout(function () { controller.abort(); }, 90000);
      const res = await fetch(BACKEND_URL + '/balance', { signal: controller.signal });
      clearTimeout(abortTimer);
      const data = await res.json().catch(function () { return {}; });

      if (res.ok && data.success) {
        render(data.balances);
        const time = new Date(data.updatedAt).toLocaleTimeString('tr-TR');
        setStatus('Son güncelleme: ' + time + (data.stale ? ' (FaucetPay şu an yanıt vermiyor, eski değer)' : ''), false);
      } else {
        setStatus(data.message || 'Bakiye alınamadı.', true);
      }
    } catch (err) {
      setStatus('Sunucuya ulaşılamıyor.', true);
    } finally {
      clearTimeout(slowTimer);
      refreshBtn.classList.remove('spinning');
      loading = false;
    }
  }

  refreshBtn.addEventListener('click', loadBalance);
  loadBalance();
  setInterval(loadBalance, 60000);
</script>

</body>
</html>
