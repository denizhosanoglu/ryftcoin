<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RYFTcoin — Kripto Çek</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131f;
      --border: #1e1e30;
      --accent: #7c3aed;
      --accent2: #06b6d4;
      --text: #e2e8f0;
      --muted: #64748b;
      --success: #10b981;
      --error: #ef4444;
      --warn: #f59e0b;
      --glow: 0 0 40px rgba(124, 58, 237, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 20%, rgba(124,58,237,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 80%, rgba(6,182,212,0.08) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 60px 20px 40px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .logo-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: var(--glow);
    }

    .logo-text {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--muted);
      font-size: 16px;
      font-family: 'Space Mono', monospace;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .banner {
      display: none;
      margin-bottom: 20px;
      padding: 12px 16px;
      border-radius: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--warn);
    }
    .banner.show { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
    }

    .card h2 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .info {
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .info strong { color: var(--accent2); font-weight: 700; }

    .field { margin-bottom: 20px; }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      font-family: 'Space Mono', monospace;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
    }

    select option { background: var(--surface); }

    .hint {
      font-size: 12px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      margin-top: 6px;
    }

    #turnstile { margin: 4px 0 8px; min-height: 65px; }

    .submit-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), #9333ea);
      border: none;
      border-radius: 14px;
      color: white;
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: var(--glow);
      letter-spacing: 0.03em;
    }

    .submit-btn:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 0 60px rgba(124,58,237,0.4);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 16px 18px;
      border-radius: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      line-height: 1.6;
      display: none;
      word-break: break-word;
      white-space: pre-line;
    }

    .message.success {
      display: block;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--success);
    }

    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: var(--error);
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
      font-family: 'Space Mono', monospace;
    }

    .dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <span class="logo-text">RYFTcoin</span>
  </div>
  <p>Kripto paranı FaucetPay adresine çek</p>
</header>

<main>
  <div class="banner" id="testBanner">
    Test modu: şu an gerçek ödeme yapılmıyor, çekimler sadece denemedir.
  </div>

  <div class="card">
    <h2>💸 Withdraw</h2>
    <p class="info" id="info">Ayarlar yükleniyor...</p>

    <div class="field">
      <label for="currency">Para Birimi</label>
      <select id="currency" disabled></select>
    </div>

    <div class="field">
      <label for="address">FaucetPay Adresi</label>
      <input
        type="text"
        id="address"
        placeholder="FaucetPay'e bağlı adresin veya e-postan"
        autocomplete="off"
        spellcheck="false"
        maxlength="128"
      />
      <div class="hint">Adres, FaucetPay hesabına kayıtlı olmalı.</div>
    </div>

    <div id="turnstile"></div>

    <button class="submit-btn" id="withdrawBtn" disabled>Withdraw</button>

    <div class="message" id="message" role="status"></div>
  </div>
</main>

<footer>powered by FaucetPay</footer>

<script>
  // Backend adresin (Railway/Render vb.). Sonunda "/" olmasın.
  const BACKEND_URL = 'https://ryftcoin-production.up.railway.app';

  const currencyEl = document.getElementById('currency');
  const addressEl  = document.getElementById('address');
  const btn        = document.getElementById('withdrawBtn');
  const messageEl  = document.getElementById('message');
  const infoEl     = document.getElementById('info');
  const bannerEl   = document.getElementById('testBanner');

  let config = null;
  let tsReady = false;
  let widgetId = null;
  let token = '';

  function showMsg(type, text) {
    messageEl.className = 'message ' + type;
    messageEl.textContent = text;
  }

  function updateButton() {
    btn.disabled = !(config && token);
  }

  // Turnstile script'i yüklenince
  window.onTurnstileLoad = function () {
    tsReady = true;
    renderWidget();
  };

  function renderWidget() {
    if (!tsReady || !config || widgetId !== null) return;
    if (!config.turnstileSiteKey) {
      showMsg('error', 'Bot doğrulaması yapılandırılmamış (site anahtarı yok).');
      return;
    }
    widgetId = turnstile.render('#turnstile', {
      sitekey: config.turnstileSiteKey,
      theme: 'dark',
      callback: function (t) { token = t; updateButton(); },
      'expired-callback': function () { token = ''; updateButton(); },
      'error-callback': function () { token = ''; updateButton(); },
    });
  }

  async function loadConfig() {
    try {
      const res = await fetch(BACKEND_URL + '/config');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      config = await res.json();

      currencyEl.innerHTML = '';
      for (const c of config.currencies) {
        const opt = document.createElement('option');
        opt.value = c.code;
        opt.textContent = c.code + '  (' + c.amount + ' ' + c.code + ')';
        currencyEl.appendChild(opt);
      }
      currencyEl.disabled = false;

      const first = config.currencies[0];
      infoEl.innerHTML = '';
      infoEl.append('Her çekimde ');
      const strong = document.createElement('strong');
      strong.textContent = first.amount + ' ' + first.code;
      infoEl.append(strong, ' gönderilir. Her adres ve her IP için ' + config.cooldownMinutes + ' dakikada bir çekebilirsin.');

      if (config.mode === 'test') bannerEl.classList.add('show');
      renderWidget();
      updateButton();
    } catch (err) {
      infoEl.textContent = 'Sunucuya ulaşılamıyor, biraz sonra tekrar dene.';
    }
  }

  btn.addEventListener('click', async function () {
    const address  = addressEl.value.trim();
    const currency = currencyEl.value;

    messageEl.className = 'message';
    messageEl.textContent = '';

    if (address.length < 3) {
      showMsg('error', 'Lütfen geçerli bir adres gir.');
      return;
    }
    if (!token) {
      showMsg('error', 'Önce bot doğrulamasını tamamla.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="dots">Gönderiliyor</span>';

    try {
      const res = await fetch(BACKEND_URL + '/withdraw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address: address, currency: currency, token: token }),
      });
      const data = await res.json().catch(function () { return {}; });

      if (res.ok && data.success) {
        let text = '✅ ' + data.amount + ' ' + data.currency + ' gönderildi.';
        if (data.id) text += '\nİşlem No: ' + data.id;
        if (data.test) text += '\n(Test modu, gerçek ödeme yapılmadı.)';
        showMsg('success', text);
      } else {
        showMsg('error', '❌ ' + (data.message || 'Bir hata oluştu.'));
      }
    } catch (err) {
      showMsg('error', '❌ Sunucuya bağlanılamadı.');
    } finally {
      // Turnstile token'ı tek kullanımlık: her denemeden sonra yenile
      token = '';
      if (widgetId !== null) turnstile.reset(widgetId);
      btn.textContent = 'Withdraw';
      updateButton();
    }
  });

  loadConfig();
</script>

</body>
</html>
